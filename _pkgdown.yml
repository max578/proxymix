  - has_concept("decision")
- title: Missing data
  desc: Multiple imputation by mixture conditioning, with pooling and the fraction of missing information.
  contents:
  - has_concept("imputation")
- title: State-space instability testing
  desc: End-of-sample structural-break test on the Gaussian-sum filter.
  contents:
