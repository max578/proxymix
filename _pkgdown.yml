  - has_concept("interface")
- title: Classes
  desc: The S7 class hierarchy.
  contents:
  - has_concept("classes")
- title: Target constructors
  desc: Ways to build a `gmm_target` — from samples, from a log-density, or from a built-in.
  contents:
  - has_concept("targets")
- title: Fitting regimes
  desc: The three KL-optimal fitting regimes from Hoek and Elliott (2024).
  contents:
  - has_concept("fitting")
- title: Closed-form mixture operators
  desc: Density, sampling, marginalisation, conditioning, divergence.
  contents:
  - has_concept("ops")
- title: Affine and causal operators
  desc: Pushforward, Kalman update, conditioning, the do-operator and the counterfactual.
  contents:
  - has_concept("operators")
- title: Decision layer (uplift / next-best-action)
  desc: One joint fit read as CATE, optimal action, off-line policy value, and an identification audit.
