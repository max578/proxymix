  - has_concept("proposals")
- title: Initialisation
  desc: Initial guesses + best-of-multistart wrapper.
  contents:
  - has_concept("init")
- title: Diagnostics
  desc: KLD trace, ESS, Hellinger MC, information criteria.
  contents:
  - has_concept("diagnostics")
- title: Planned features
  desc: Signatures only; not yet implemented.
  contents:
  - has_concept("stubs")

